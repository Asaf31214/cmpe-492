[project]
name = "cmpe-492"
version = "0.1.0"
requires-python = ">=3.13, <3.14"
dependencies = [
    "faiss-cpu>=1.14.2",
    "fastexcel>=0.20.2",
    "ipywidgets==8.1.8",
    "jupyterlab==4.5.7",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "ollama>=0.6.2",
    "pillow>=12.2.0",
    "polars>=1.41.2",
    "pydantic>=2.13.4",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "torch==2.12.0",
    "torchvision>=0.27.0",
    "tqdm>=4.67.3",
    "transformers>=5.9.0",
    "xgboost>=3.2.0",
]

[dependency-groups]
dev = [
    "ruff==0.15.15",
    "ty==0.0.42",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true


[tool.uv]
managed = true
python-preference = "only-managed"

[tool.ruff]
line-length = 120
lint.select = ["I", "F", "E", "W", "UP"]
