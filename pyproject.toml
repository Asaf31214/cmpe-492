[project]
name = "cmpe-492"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "flash-attn==2.8.3",
    "ipywidgets==8.1.8",
    "jupyterlab==4.5.5",
    "numpy>=2.4.2",
    "polars>=1.38.1",
    "seaborn>=0.13.2",
    "torch==2.10.0",
    "torchvision==0.25.0",
]

[dependency-groups]
dev = [
    "prek==0.3.3",
    "ruff==0.15.2",
    "ty==0.0.18",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
flash-attn = { url = "https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.7.16/flash_attn-2.8.3+cu130torch2.10-cp314-cp314-linux_x86_64.whl" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true


[tool.uv]
managed = true
python-preference = "only-managed"

[tool.ruff]
line-length = 120
lint.select = ["I", "F", "E", "W", "UP"]