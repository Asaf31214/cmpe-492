[project]
name = "cmpe-492"
version = "0.1.0"
requires-python = ">=3.13, <3.14"
dependencies = [
    "fastexcel>=0.19.0",
    "flash-attn==2.8.3",
    "ipywidgets==8.1.8",
    "jupyterlab==4.5.6",
    "numpy>=2.2,<2.3",
    "ollama>=0.6.1",
    "polars>=1.39.3",
    "pydantic>=2.0.0",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "torch==2.10.0",
    "tqdm>=4.67.3",
    "vllm>=0.19.0",
    "xgboost>=3.2.0",
]

[dependency-groups]
dev = [
    "ruff==0.15.5",
    "ty==0.0.21",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
flash-attn = { url = "https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.7.16/flash_attn-2.8.3+cu130torch2.10-cp313-cp313-linux_x86_64.whl" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true


[tool.uv]
managed = true
python-preference = "only-managed"

[tool.ruff]
line-length = 120
lint.select = ["I", "F", "E", "W", "UP"]
